<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAJA MEDIA</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#111827}
header{background:linear-gradient(135deg,#111827,#2563eb);color:#fff;text-align:center;padding:28px 15px}
header h1{margin:0 0 7px;font-size:36px}header p{margin:0}
.ad{text-align:center;background:#fff;padding:5px;min-height:58px;overflow:hidden}.mobile{display:none}
.nav{display:flex;justify-content:center;gap:10px;padding:18px;flex-wrap:wrap}.nav button{border:0;border-radius:25px;padding:11px 22px;font-weight:bold;cursor:pointer}.nav .active{background:#2563eb;color:#fff}
.search{max-width:650px;margin:0 auto 25px;padding:0 15px}.search input{width:100%;padding:14px 18px;border:1px solid #ddd;border-radius:30px;font-size:15px}
.container{max-width:1200px;margin:auto;padding:0 15px 35px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 18px #0001}.thumb{height:300px;position:relative;background:#ddd}.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:15px}.info h3{margin:0 0 7px}.info p{color:#6b7280;font-size:14px}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:9px 13px;color:#fff;font-weight:bold;cursor:pointer}.view{background:#2563eb}.download{background:#16a34a}
.adbox{background:#fff;border-radius:12px;padding:8px;text-align:center;min-height:100px;overflow:hidden}.empty{grid-column:1/-1;background:#fff;padding:35px;text-align:center;border-radius:12px}
footer{background:#111827;color:#fff;text-align:center;padding:25px;font-size:13px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:9999;padding:18px}.modal.show{display:flex;align-items:center;justify-content:center}.modalbox{position:relative;background:#fff;border-radius:14px;padding:16px;width:min(950px,100%);max-height:94vh;overflow:auto}.close{position:absolute;right:10px;top:8px;background:#111827;color:#fff;border:0;border-radius:50%;width:35px;height:35px;font-size:22px}.content{padding-top:35px;text-align:center}.content img{max-width:100%;max-height:75vh;border-radius:10px}.actions{text-align:center;margin-top:12px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){header h1{font-size:29px}.grid{grid-template-columns:1fr}.desktop{display:none}.mobile{display:block}.thumb{height:360px}}
</style>
<script src="https://pl31661640.profitableratecpmnetwork.com/87/70/b5/8770b572d1176c589b1d8bab37384c44.js"></script>
</head>
<body>
<header><h1>TAJA MEDIA</h1><p>Images • Videos • Media Gallery</p></header>

<div class="ad desktop">
<script>
atOptions={'key':'9d31700d86b65e39957a3dca40e588d7','format':'iframe','height':90,'width':728,'params':{}};
</script>
<script src="https://www.highrevenueformat.com/9d31700d86b65e39957a3dca40e588d7/invoke.js"></script>
</div>
<div class="ad mobile">
<script>
atOptions={'key':'a247e254a9cc49faff47929e3591e501','format':'iframe','height':50,'width':320,'params':{}};
</script>
<script src="https://www.highrevenueformat.com/a247e254a9cc49faff47929e3591e501/invoke.js"></script>
</div>

<div class="nav">
<button class="active" onclick="filterMedia('all',this)">All</button>
<button onclick="filterMedia('image',this)">Images</button>
<button onclick="filterMedia('video',this)">Videos</button>
</div>
<div class="search"><input id="search" placeholder="Search media..." oninput="render()"></div>

<main class="container"><h2>Latest Media</h2><div class="grid" id="grid"></div></main>

<div class="container"><div class="adbox">
<script async data-cfasync="false" src="https://pl31661639.profitableratecpmnetwork.com/b21680be381e9c867961254ab692fb79/invoke.js"></script>
<div id="container-b21680be381e9c867961254ab692fb79"></div>
</div></div>

<footer>© 2026 TAJA MEDIA — All Rights Reserved</footer>

<div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div class="content" id="content"></div><div class="actions" id="actions"></div></div></div>

<script>
const MEDIA=[
 {type:"image",title:"Media 01",description:"TAJA MEDIA",imageUrl:"media-01.jpg",thumbUrl:"media-01.jpg"},
 {type:"image",title:"Media 02",description:"TAJA MEDIA",imageUrl:"media-02.jpg",thumbUrl:"media-02.jpg"}
];
let current="all";
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function filterMedia(type,btn){current=type;document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");render()}
function render(){
 const q=document.getElementById("search").value.toLowerCase().trim();
 const list=MEDIA.filter(x=>(current==="all"||x.type===current)&&(!q||x.title.toLowerCase().includes(q)||x.description.toLowerCase().includes(q)));
 const grid=document.getElementById("grid");grid.innerHTML="";
 if(!list.length){grid.innerHTML='<div class="empty">No media found.</div>';return}
 list.forEach(x=>{
  const i=MEDIA.indexOf(x),c=document.createElement("article");c.className="card";
  c.innerHTML='<div class="thumb"><img src="'+esc(x.thumbUrl)+'" alt="'+esc(x.title)+'" loading="lazy"></div><div class="info"><h3>'+esc(x.title)+'</h3><p>'+esc(x.description)+'</p><div class="buttons"><button class="btn view" onclick="openMedia('+i+')">View Image</button><button class="btn download" onclick="downloadMedia('+i+')">Download</button></div></div>';
  grid.appendChild(c);
 });
}
function openMedia(i){const x=MEDIA[i];document.getElementById("content").innerHTML='<img src="'+esc(x.imageUrl)+'" alt="'+esc(x.title)+'">';document.getElementById("actions").innerHTML='<button class="btn download" onclick="downloadMedia('+i+')">Download Image</button>';document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("content").innerHTML="";document.getElementById("actions").innerHTML="";document.getElementById("modal").classList.remove("show")}
function downloadMedia(i){const a=document.createElement("a");a.href=MEDIA[i].imageUrl;a.download="";a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove()}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
render();
</script>
</body>
</html>
