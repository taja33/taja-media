<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAJA MEDIA</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f6fb;
    color:#222;
}

header{
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
    text-align:center;
    padding:32px 15px;
}

header h1{
    font-size:36px;
    margin-bottom:8px;
}

header p{
    font-size:15px;
    opacity:.9;
}

.tabs{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:18px 10px;
    flex-wrap:wrap;
}

.tabs button{
    border:0;
    background:#e5e7eb;
    padding:11px 22px;
    border-radius:25px;
    cursor:pointer;
    font-weight:bold;
}

.tabs button.active{
    background:#2563eb;
    color:white;
}

.search{
    max-width:650px;
    margin:0 auto 25px;
    padding:0 15px;
}

.search input{
    width:100%;
    padding:14px 18px;
    border:1px solid #ddd;
    border-radius:30px;
    outline:none;
    font-size:15px;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:0 15px 50px;
}

.section-title{
    font-size:24px;
    margin:20px 0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.card{
    background:white;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.thumb{
    height:210px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#dbeafe,#bfdbfe);
    color:#1d4ed8;
    font-size:25px;
    font-weight:bold;
    position:relative;
}

.thumb.video{
    background:linear-gradient(135deg,#111827,#374151);
    color:white;
}

.play{
    width:60px;
    height:60px;
    border-radius:50%;
    background:#ef4444;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.info{
    padding:16px;
}

.info h3{
    margin-bottom:7px;
}

.info p{
    color:#777;
    font-size:13px;
    margin-bottom:13px;
}

.buttons{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
}

.btn{
    text-decoration:none;
    color:white;
    padding:9px 13px;
    border-radius:7px;
    font-size:13px;
    font-weight:bold;
    display:inline-block;
}

.blue{background:#2563eb;}
.green{background:#16a34a;}
.orange{background:#f59e0b;}

.ad-box{
    grid-column:1/-1;
    background:white;
    border:1px dashed #bbb;
    border-radius:12px;
    padding:18px;
    text-align:center;
}

.ad-box small{
    display:block;
    color:#888;
    margin-bottom:10px;
}

.ad-btn{
    display:inline-block;
    background:#ef4444;
    color:white;
    padding:10px 25px;
    border-radius:8px;
    text-decoration:none;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:25px;
    background:#111827;
    color:white;
    font-size:13px;
}

@media(max-width:850px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:550px){
    header h1{
        font-size:29px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .thumb{
        height:220px;
    }
}
</style>
</head>

<body>

<div class="search">

<div class="container">

<footer>

</footer>
