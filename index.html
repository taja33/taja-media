<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#111}
header{background:#111;color:#fff;text-align:center;padding:20px 12px}
header h1{margin:0 0 6px;font-size:28px}
header p{margin:0;color:#ccc}
.ad-top{min-height:50px;display:flex;justify-content:center;align-items:center;padding:10px;background:#fff}
.desktop-ad{display:block}
.mobile-ad{display:none}
.container{max-width:1100px;margin:auto;padding:16px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.controls input{flex:1;min-width:220px;padding:12px;border:1px solid #ccc;border-radius:8px}
.controls button{padding:11px 16px;border:0;border-radius:8px;background:#111;color:#fff;cursor:pointer}
.controls button.active{background:#007bff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #0001}
.thumb{width:100%;height:220px;object-fit:cover;display:block;background:#ddd}
.card-body{padding:12px}
.card h3{margin:0 0 10px;font-size:17px}
.card button,.download{display:inline-block;padding:9px 12px;border:0;border-radius:7px;background:#111;color:#fff;text-decoration:none;cursor:pointer;margin-right:6px}
.download{background:#16833a}
.native-ad{margin:20px 0;padding:12px;background:#fff;border-radius:10px;text-align:center}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{max-width:95vw;max-height:90vh}
.modal img,.modal video{max-width:95vw;max-height:85vh;border-radius:8px}
.close{position:fixed;top:15px;right:20px;color:#fff;font-size:34px;cursor:pointer}
footer{text-align:center;padding:25px;color:#666}
@media(max-width:700px){
 .desktop-ad{display:none}.mobile-ad{display:block}
 header h1{font-size:24px}
 .thumb{height:200px}
}
</style>
</head>

<div id="imageModal" class="modal" onclick="closeImage()">
  <span class="close">×</span>
  <img id="modalImage" class="modal-content" alt="">
</div>

<div id="videoModal" class="modal" onclick="closeVideo(event)">
  <span class="close">×</span>
  <video id="modalVideo" class="modal-content" controls playsinline></video>
</div>

<footer>© TAJA MEDIA</footer>

<script>
const cards=[...document.querySelectorAll('.card')];
const buttons=[...document.querySelectorAll('[data-filter]')];
const search=document.getElementById('search');

function filterCards(){
  const f=document.querySelector('.active').dataset.filter;
  const q=search.value.toLowerCase().trim();
  cards.forEach(c=>{
    const okType=f==='all'||c.dataset.type===f;
    const okText=!q||c.dataset.title.toLowerCase().includes(q);
    c.style.display=okType&&okText?'block':'none';
  });
}
buttons.forEach(b=>b.addEventListener('click',()=>{
  buttons.forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  filterCards();
}));
search.addEventListener('input',filterCards);

function openImage(src){
  document.getElementById('modalImage').src=src;
  document.getElementById('imageModal').classList.add('show');
}
function closeImage(){
  document.getElementById('imageModal').classList.remove('show');
  document.getElementById('modalImage').src='';
}
function openVideoFile(file){
  const v=document.getElementById('modalVideo');
  v.src=file;
  document.getElementById('videoModal').classList.add('show');
  v.play().catch(()=>{});
}
function openVideo(){ openVideoFile('video-01.mp4'); }
function closeVideo(e){
  if(e.target.id==='videoModal'||e.target.classList.contains('close')){
    document.getElementById('videoModal').classList.remove('show');
    const v=document.getElementById('modalVideo');
    v.pause(); v.removeAttribute('src'); v.load();
  }
}
</script>
